services:
  coding-runner-sandbox:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    image: nexus-coding-sandbox:local

  coding-runner:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - coding-runner-sandbox
    environment:
      PORT: "8090"
      CODING_RUNNER_TOKEN: ${CODING_RUNNER_TOKEN:?Set CODING_RUNNER_TOKEN before starting the runner}
      CODING_RUNNER_IMAGE: nexus-coding-sandbox:local
      CODING_RUNNER_WORK_ROOT: /var/lib/nexus-runner
      CODING_RUNNER_HOST_WORK_ROOT: ${CODING_RUNNER_HOST_WORK_ROOT:?Set CODING_RUNNER_HOST_WORK_ROOT to an absolute host path}
      CODING_RUNNER_TIMEOUT_MS: ${CODING_RUNNER_TIMEOUT_MS:-120000}
      CODING_RUNNER_MAX_CONCURRENT: ${CODING_RUNNER_MAX_CONCURRENT:-2}
      CODING_RUNNER_PREVIEW_RETENTION_MS: ${CODING_RUNNER_PREVIEW_RETENTION_MS:-1800000}
      CODING_RUNNER_MAX_PREVIEWS: ${CODING_RUNNER_MAX_PREVIEWS:-4}
      CODING_RUNNER_MAX_BUILDS: ${CODING_RUNNER_MAX_BUILDS:-40}
      CODING_RUNNER_MAX_CONCURRENT_BUILDS: ${CODING_RUNNER_MAX_CONCURRENT_BUILDS:-1}
      CODING_RUNNER_BUILD_TIMEOUT_MS: ${CODING_RUNNER_BUILD_TIMEOUT_MS:-1800000}
      CODING_DEPLOY_SSH_HOST: ${CODING_DEPLOY_SSH_HOST:-}
      CODING_DEPLOY_SSH_USER: ${CODING_DEPLOY_SSH_USER:-nexus-deploy}
      CODING_DEPLOY_SSH_PORT: ${CODING_DEPLOY_SSH_PORT:-22}
      CODING_DEPLOY_SSH_PRIVATE_KEY_BASE64: ${CODING_DEPLOY_SSH_PRIVATE_KEY_BASE64:-}
      CODING_DEPLOY_SSH_KNOWN_HOSTS: ${CODING_DEPLOY_SSH_KNOWN_HOSTS:-}
    ports:
      - "${CODING_RUNNER_BIND_IP:-127.0.0.1}:8090:8090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CODING_RUNNER_HOST_WORK_ROOT:?Set CODING_RUNNER_HOST_WORK_ROOT to an absolute host path}:/var/lib/nexus-runner
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    user: "0:0"
    restart: unless-stopped
